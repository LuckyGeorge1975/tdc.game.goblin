<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isolierte Karten-Bake-Probe</title>
<style>
body{margin:1rem;font:16px system-ui;background:#18201b;color:#f3f3ec}
button,a{font:inherit;min-height:44px;margin:.25rem;padding:.5rem 1rem}
button{cursor:pointer}a{color:#a8dfd2}pre{white-space:pre-wrap;overflow-wrap:anywhere}
img{display:block;width:min(100%,960px);height:auto;border:1px solid #4e6257}
iframe{display:none}
</style>
<h1>Lokale Karten-Bake-Probe</h1>
<p>Nur <code>showcase-terrain-course</code>, keine Spielintegration. Die mitgelieferte Generator-HTML läuft in einem gleichursprünglichen, versteckten Frame. Es wird kein Browser oder Profil angelegt.</p>
<p><button type="button" id="b192">192 px je Hex</button><button type="button" id="b256">256 px je Hex</button></p>
<p id="downloads"></p>
<pre id="status">Bereit. Ein Renderlauf startet erst nach Klick.</pre>
<img id="preview" alt="Gerenderte Terrain-Karte" hidden>
<iframe id="generator" src="generator.html" title="Gepinnter Kartengenerator"></iframe>
<script>
const status = document.querySelector('#status');
const preview = document.querySelector('#preview');
const frame = document.querySelector('#generator');
let previousUrls = [];
const blobOf = (canvas, type, quality) => new Promise((resolve, reject) =>
  canvas.toBlob(blob => blob ? resolve(blob) : reject(Error(`toBlob ${type} failed`)), type, quality));
async function sha256(blob) {
  const data = await blob.arrayBuffer();
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))]
    .map(value => value.toString(16).padStart(2, '0')).join('');
}
async function renderProbe(width) {
  if (![192, 256].includes(width)) throw Error('Only reviewed widths are allowed');
  if (!frame.contentWindow?.renderLevel) throw Error('Pinned generator not ready');
  const level = await (await fetch('level.json', {cache: 'no-store'})).json();
  if (level.id !== 'showcase-terrain-course' || level.width !== 12 || level.height !== 8)
    throw Error('Unexpected level data');
  status.textContent = `Erzeuge ${width} px…`;
  const start = performance.now();
  const generated = await frame.contentWindow.renderLevel(level, width);
  const renderMs = performance.now() - start;
  const canvas = frame.contentWindow.__r.final;
  if (canvas.width !== generated.size[0] || canvas.height !== generated.size[1])
    throw Error('Generated canvas size mismatch');
  const png = await blobOf(canvas, 'image/png');
  const webp = await blobOf(canvas, 'image/webp', .85);
  if (webp.type !== 'image/webp') throw Error('WebP encoding unsupported');
  const decodeStart = performance.now();
  const bitmap = await createImageBitmap(webp);
  const webpDecodeMs = performance.now() - decodeStart;
  bitmap.close();
  for (const url of previousUrls) URL.revokeObjectURL(url);
  const pngUrl = URL.createObjectURL(png), webpUrl = URL.createObjectURL(webp);
  previousUrls = [pngUrl, webpUrl];
  preview.src = webpUrl; preview.hidden = false;
  document.querySelector('#downloads').replaceChildren(...[
    ['PNG', pngUrl], ['WebP', webpUrl]
  ].map(([label, url]) => {
    const link = document.createElement('a');
    link.href = url; link.download = `showcase-terrain-course-${width}.${label.toLowerCase()}`;
    link.textContent = `${label} speichern`;
    return link;
  }));
  const result = {level: level.id, width, size: generated.size,
    renderMs: Math.round(renderMs), pngBytes: png.size, pngSha256: await sha256(png),
    webpBytes: webp.size, webpSha256: await sha256(webp),
    webpDecodeMs: Math.round(webpDecodeMs), decodedRGBABytes: canvas.width * canvas.height * 4,
    environment: navigator.userAgent};
  status.textContent = JSON.stringify(result, null, 2);
  return result;
}
for (const width of [192, 256]) {
  document.querySelector(`#b${width}`).onclick = () =>
    renderProbe(width).catch(error => { status.textContent = String(error.stack || error); });
}
window.mapBakeProbe = Object.freeze({render: renderProbe});
</script>
</html>
