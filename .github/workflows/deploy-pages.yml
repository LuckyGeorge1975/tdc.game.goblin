name: Deploy G.O.B.L.I.N to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use qualified test runtime
        # The source-bound experiment parser qualifies this exact Node/Acorn build.
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Confirm test runtime
        run: node --version
      - name: Verify release handoff
        run: |
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)"
          node scripts/verify-release.mjs --previous="$previous_tag"
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure optional project support link
        env:
          GOBLIN_SUPPORT_URL: ${{ secrets.GOBLIN_SUPPORT_URL }}
        run: node scripts/configure-pages-support.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
