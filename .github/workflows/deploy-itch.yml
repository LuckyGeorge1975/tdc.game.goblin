name: Deploy G.O.B.L.I.N to itch.io
run-name: itch.io ${{ inputs.release_tag }} (${{ inputs.publish && 'publish' || 'package only' }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag on the published Pages release
        required: true
        type: string
      pages_commit:
        description: Full commit SHA of the independently checked Pages release
        required: true
        type: string
      publish:
        description: Send the package to luckygeorge/goblin:html5
        default: false
        type: boolean

permissions: {}

jobs:
  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.build.outputs.filename }}
      sha256: ${{ steps.build.outputs.sha256 }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout workflow and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package immutable release
        id: build
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PAGES_COMMIT: ${{ inputs.pages_commit }}
        run: |
          receipt=$(python3 scripts/package-itch.py "$RELEASE_TAG" "$PAGES_COMMIT" --output "$RUNNER_TEMP/itch-build")
          printf '%s\n' "$receipt" | jq -r '"filename=\(.file)", "sha256=\(.sha256)", "version=\(.version)"' >> "$GITHUB_OUTPUT"
          printf '```json\n%s\n```\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain ZIP and receipt
        uses: actions/upload-artifact@v4
        with:
          name: itch-html5
          path: ${{ runner.temp }}/itch-build/
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'LuckyGeorge1975/tdc.game.goblin' }}
    needs: package
    permissions:
      actions: read
    runs-on: ubuntu-latest
    environment:
      name: itch-io
      url: https://luckygeorge.itch.io/goblin
    concurrency:
      group: itch-io-html5
      cancel-in-progress: false
    env:
      ZIP_NAME: ${{ needs.package.outputs.filename }}
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: itch-html5
          path: ${{ runner.temp }}/itch-build
      - name: Install pinned Butler release
        run: |
          archive="$RUNNER_TEMP/butler-linux-amd64.zip"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/itchio/butler/releases/download/v15.32.0/butler-linux-amd64.zip' \
            --output "$archive"
          printf '5db7b053fc9b578b86ffaf3520a12b952eb95c9225171cc5720dfbc9fe4574b3  %s\n' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/linux-amd64/butler"
      - name: Confirm the current Pages release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.pages_commit }}
          PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          zip="$RUNNER_TEMP/itch-build/$ZIP_NAME"
          printf '%s  %s\n' "$PACKAGE_SHA256" "$zip" | sha256sum --check
          pages=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0] | [.head_sha, .html_url] | @tsv')
          IFS=$'\t' read -r pages_sha pages_run <<< "$pages"
          if [[ "$pages_sha" != "$EXPECTED_SHA" ]]; then
            echo 'The requested commit is not the latest successful main Pages deployment.' >&2
            exit 1
          fi
          unzip -p "$zip" release.js > "$RUNNER_TEMP/packaged-release.js"
          curl --fail --silent --show-error --location --retry 3 \
            "https://luckygeorge1975.github.io/tdc.game.goblin/release.js?commit=$EXPECTED_SHA" \
            --output "$RUNNER_TEMP/published-release.js"
          diff --strip-trailing-cr "$RUNNER_TEMP/packaged-release.js" "$RUNNER_TEMP/published-release.js"
          printf 'Pages workflow: %s\n' "$pages_run" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo 'Configure BUTLER_API_KEY in the itch-io environment.' >&2
            exit 1
          fi
          "$RUNNER_TEMP/butler/linux-amd64/butler" push "$RUNNER_TEMP/itch-build/$ZIP_NAME" \
            luckygeorge/goblin:html5 --userversion "$RELEASE_VERSION"
          printf 'Uploaded version %s to `luckygeorge/goblin:html5`.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
