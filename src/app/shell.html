<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>G.O.B.L.I.N. · Modular</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./shell.css">
</head>
<body>
  <div id="app" aria-live="off">
    <header class="topbar"><a class="brand" href="./shell.html">G.O.B.L.I.N.</a><span class="build">INTERNER MODULARER SPIELPFAD</span><div id="language-slot"></div></header>
    <main>
      <section id="screen-start" class="screen landing"><p class="eyebrow">GROUND OPERATIONS · BATTLEFIELD LOGISTICS · INTELLIGENCE NETWORK</p><h1 id="start-title"></h1><p id="start-subtitle"></p><button id="choose-mission" class="primary" type="button"></button><div class="row"><button id="start-settings" type="button"></button><button id="start-help" type="button"></button></div></section>
      <section id="screen-levels" class="screen landing" hidden><button class="back" data-route="start" type="button"></button><h1 id="levels-title"></h1><div id="mission-list" class="mission-list"></div></section>
      <section id="screen-briefing" class="screen landing" hidden><button class="back" data-route="levels" type="button"></button><p class="eyebrow" id="briefing-label"></p><h1 id="briefing-title"></h1><p id="briefing-objective"></p><p id="briefing-copy"></p><button id="begin-mission" class="primary" type="button"></button></section>
      <section id="screen-game" class="screen game" hidden>
        <div class="missionbar"><div><strong id="game-mission"></strong><p id="game-objective"></p><small id="game-progress"></small></div><div class="phase"><strong id="game-phase"></strong><span id="game-turn"></span><span id="game-ready"></span></div><button id="pause" type="button"></button></div>
        <div class="game-layout">
          <aside class="details" id="details"><div class="detail-tabs"><button data-detail="units" type="button"></button><button data-detail="intel" type="button"></button><button data-detail="log" type="button"></button></div><div id="detail-units" class="detail-body"></div><div id="detail-intel" class="detail-body" hidden></div><ol id="detail-log" class="detail-body" hidden></ol></aside>
          <div class="map-column"><div class="map-tools"><div class="segments"><button data-area="movement" type="button"></button><button data-area="fire" type="button"></button><button data-area="sight" type="button"></button></div><div class="map-options"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="recenter" type="button"></button><button id="grid" type="button" aria-pressed="false"></button><select id="terrain-set" aria-label="Terrain"><option value="hex">Hexkarte</option><option value="verdant">Verdant Atlas</option><option value="dryland">Dryland Survey</option></select></div></div><div id="map-viewport" class="map-viewport"><svg id="battle-map" role="img" aria-label="Battle map"></svg></div></div>
          <aside class="action-panel"><div class="selection"><strong id="selection-title"></strong><p id="selection-detail"></p><p id="intent-detail" role="status"></p></div><div class="actions"><button id="cancel-intent" type="button" hidden></button><button id="confirm-intent" class="primary" type="button" hidden></button><button id="end-phase" class="primary" type="button"></button></div></aside>
        </div>
      </section>
      <section id="screen-pause" class="screen landing" hidden><h1 id="pause-title"></h1><button id="resume" class="primary" type="button"></button><div class="row"><button id="pause-settings" type="button"></button><button id="pause-help" type="button"></button><button id="restart" type="button"></button><button id="missions" type="button"></button></div></section>
      <section id="screen-settings" class="screen landing" hidden><button class="back" id="settings-back" type="button"></button><h1 id="settings-title"></h1><label id="settings-language-label" for="language"></label><select id="language"><option value="de">Deutsch</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select><p id="settings-note"></p></section>
      <section id="screen-help" class="screen landing" hidden><button class="back" id="help-back" type="button"></button><h1 id="help-title"></h1><p id="help-copy"></p></section>
      <section id="screen-end" class="screen landing" hidden><h1 id="end-title"></h1><p id="end-copy"></p><button id="retry" class="primary" type="button"></button><button id="end-missions" type="button"></button><button id="end-log" type="button"></button></section>
    </main>
  </div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body"><h2 id="dialog-title"></h2><p id="dialog-body"></p><label id="remember-row" hidden><input id="remember-phase" type="checkbox"><span id="remember-label"></span></label><div class="dialog-actions"><button id="dialog-cancel" type="button"></button><button id="dialog-confirm" type="button"></button></div></dialog>
  <script src="../../localization.js?v=1"></script>
  <script type="importmap">{"imports":{"/terrain-rules.js":"./terrain-rules-bridge.mjs"}}</script>
  <script type="module" src="./shell.mjs"></script>
</body>
</html>
